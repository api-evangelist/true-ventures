aid: true-ventures
name: True Ventures
description: >-
  True Ventures is an early-stage venture capital firm founded in 2006 by Jon Callaghan and Phil Black and
  headquartered in Palo Alto / San Francisco, California. Operating under a "first to believe" thesis, True
  writes the initial institutional check and stays invested through every subsequent stage of a company's
  journey, concentrating on pre-seed, seed, and Series A rounds with check sizes reported in the roughly
  $500K-$15M range. The firm invests broadly across technology and founder-led categories including software
  and developer infrastructure, consumer products and internet, healthcare and life sciences, hardware and
  robotics, climate and energy, security, and AI. With more than $3.8B in committed capital, True has backed
  1,050+ founders across 500+ companies since inception, with notable early checks into Fitbit, Peloton,
  Ring, Automattic/WordPress, HashiCorp, Duo Security, Sweetgreen, Bluesky, and Splice. True is known for its
  founder-first platform, the True University founder camps, and long-term conviction-led early ownership.
